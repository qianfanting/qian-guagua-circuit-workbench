anvasBox{margin:0 14px 14px;background:#fff;border:1px solid #ccd9e7;border-radius:9px;overflow:hidden}.desk{display:block;width:100%;height:calc(100vh - 300px);min-height:470px;touch-action:none}.symbol{stroke:#2d425a;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.part{cursor:move}.part .hit{fill:transparent}.part .selectedBox{display:none;fill:none;stroke:#2679d2;stroke-width:1.5;stroke-dasharray:4 4}.part.selected .selectedBox{display:block}.part.on .symbol{stroke:#168053}.part.lit .symbol{stroke:#db8a00;stroke-width:3.5}.part.lit .glow{fill:#ffe58a;stroke:#e5a700;stroke-width:2}.name{fill:#526276;font-size:10px;font-weight:500;text-anchor:middle;pointer-events:none}.portTarget{fill:transparent;cursor:crosshair}.portDot{fill:#fff;stroke:#2780d8;stroke-width:2;pointer-events:none}.portDot.pending{fill:#2376d1;stroke:#12508f}.wire{fill:none;stroke:#405a78;stroke-width:2.8;pointer-events:none}.wire.selected{stroke:#2376d1;stroke-width:4.5}.wireHit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}.preview{fill:none;stroke:#2686df;stroke-width:2;stroke-dasharray:6 4;pointer-events:none}.simulating .part{cursor:pointer}.simulating .portTarget{cursor:default}input[type=file]{display:none}@media(max-width:650px){.desk{height:65vh}.tool{width:70px;min-width:70px}}

<body>
<header><div><h1>电气电路拖拽工作台</h1><small>Mac 离线版 · 变压器供电演示修复</small></div><div class="actions"><button id="undo" title="撤回上一步（⌘Z / Ctrl+Z）">↶ 撤回</button><button id="new">新建</button><button id="demo">简单示例</button><button id="linkMode">联动设置</button><button id="simulate" class="primary">▶ 开始演示</button><button id="rename">改名称</button><button id="remove">删除选中</button><button id="save">保存工程</button><button id="open">打开工程</button><input id="file" type="file" accept=".json,application/json"></div></header>

<div class="rotationBar"><button id="rotate" title="选中元件后旋转 90°（快捷键 R）">↻ 旋转 90°</button><label for="rotationRange">任意角度</label><input id="rotationRange" type="range" min="0" max="359" value="0"><input id="rotationNumber" type="number" min="0" max="359" value="0"><span>°</span><span id="rotationTarget">请先选中画布上的元件</span></div>

<div class="hint"><span>拖元件到画布；点击两个蓝点或拖动蓝点接线。接线时点击空白处可加折点。演示支持基础开关、负载及简化变压器。</span><span id="simulationStatus" aria-live="polite"></span><span id="message">从蓝点引线，点击已有导线可自动接入并生成黑点；选中黑点按 Delete 仅隐藏标记。</span></div>

const fourPort=t=>t==='transformer'||t==='transformer3';

function circleText(text){return '<path d="M-42 0 H-19 M19 0 H42"/><circle r="19"/><text x="0" y="5" font-size="13" text-anchor="middle" fill="#2d425a" stroke="none">'+text+'</text>'}
function contacts(nc,top='',connected=nc){return '<path d="M-42 0 H-11 M11 0 H42 M-11 -17 V17 M11 -17 V17 '+(nc?'M-15 15 L15 -15':'')+' '+(connected?'M-11 0 H11':'')+' '+top+'"/>'}
function symbol(t,closed=false){switch(t){case'node':return '<circle r="3.6" fill="#2d425a" stroke="none"/>'; 
case'phase3':return '<rect x="-38" y="-27" width="76" height="52" rx="6"/><text x="0" y="5" font-size="16" text-anchor="middle" fill="#2d425a" stroke="none">3~</text><path d="M-24 25 V42 M0 25 V42 M24 25 V42"/>';
case'motor3line':return '<circle r="32"/><text x="0" y="4" font-size="16" text-anchor="middle" fill="#2d425a" stroke="none">M</text><text x="0" y="20" font-size="11" text-anchor="middle" fill="#2d425a" stroke="none">3~</text><path d="M-24 -42 V-28 M0 -42 V-32 M24 -42 V-28 M31 0 H42"/>';
case'breaker3':case'thermal3':case'contact3':return [-24,0,24].map(x=>'<path d="M'+x+' -42 V-21 M'+x+' 21 V42 '+(!closed?'M'+x+' -21 L'+(x+9)+' 18':'M'+x+' -21 V21')+'"/>').join('')+(t==='thermal3'?'<rect x="-37" y="-19" width="74" height="38" rx="3"/><text x="0" y="5" font-size="10" text-anchor="middle" fill="#2d425a" stroke="none">FR</text>':t==='breaker3'?'<text x="0" y="5" font-size="10" text-anchor="middle" fill="#2d425a" stroke="none">QS</text>':'<text x="0" y="-3" font-size="10" text-anchor="middle" fill="#2d425a" stroke="none">KM</text>');
case'phase3':return '<rect x="-38" y="-27" width="76" height="52" rx="6"/><text x="0" y="5" font-size="16" text-anchor="middle" fill="#2d425a" stroke="none">3~</text><path d="M-24 25 V42 M0 25 V42 M24 25 V42"/>';
case'motor3line':return '<circle r="32"/><text x="0" y="4" font-size="16" text-anchor="middle" fill="#2d425a" stroke="none">M</text><text x="0" y="20" font-size="11" text-anchor="middle" fill="#2d425a" stroke="none">3~</text><path d="M-24 -42 V-28 M0 -42 V-32 M24 -42 V-28 M31 0 H42"/>';
case'breaker3':case'thermal3':case'contact3':return [-24,0,24].map(x=>'<path d="M'+x+' -42 V-21 M'+x+' 21 V42 '+(t==='contact3'&&!closed?'M'+x+' -21 L'+(x+9)+' 18':'M'+x+' -21 V21')+'"/>').join('')+(t==='thermal3'?'<rect x="-37" y="-19" width="74" height="38" rx="3"/><text x="0" y="5" font-size="10" text-anchor="middle" fill="#2d425a" stroke="none">FR</text>':t==='breaker3'?'<text x="0" y="5" font-size="10" text-anchor="middle" fill="#2d425a" stroke="none">QS</text>':'<text x="0" y="-3" font-size="10" text-anchor="middle" fill="#2d425a" stroke="none">KM</text>');
case'panel':return '<rect x="-35" y="-30" width="70" height="60" rx="3"/><text x="-19" y="-14" font-size="10" fill="#2d425a" stroke="none">L</text><text x="-19" y="4" font-size="10" fill="#2d425a" stroke="none">N</text><text x="-24" y="22" font-size="10" fill="#2d425a" stroke="none">PE</text><path d="M0 -18 H42 M0 0 H42 M0 18 H42"/>';
case'phase':return circleText('L');case'neutral':return circleText('N');case'ac':return circleText('~');case'threephase':return circleText('3~');
case'dc':return '<path d="M-42 0 H-14 M-14 -18 V18 M-6 -11 V11 M6 -18 V18 M14 -11 V11 M14 0 H42"/>';
case'ground':return '<path d="M-42 0 H42 M0 0 V14 M-15 14 H15 M-10 20 H10 M-5 26 H5"/>';
case'transformer':case'transformer3':return '<path d="M-42 -18 H-26 M-42 18 H-26 M26 -18 H42 M26 18 H42 M-26 -18 Q-14 -31 -14 -18 Q-14 -5 -26 -18 M-26 18 Q-14 5 -14 18 Q-14 31 -26 18 M26 -18 Q14 -31 14 -18 Q14 -5 26 -18 M26 18 Q14 5 14 18 Q14 31 26 18 M-5 -33 V33 M5 -33 V33"/>'+(t==='transformer3'?'<text x="0" y="4" font-size="8" text-anchor="middle" fill="#2d425a" stroke="none">3~</text>':'');
case'switch':case'disconnector':case'selector':case'breaker':return `<path d="M-42 0 H-19 M19 0 H42 M-19 0 L${closed?'19 0':'13 -16'}"/><circle cx="-19" r="3"/><circle cx="19" r="3"/>`;
case'spdt':return `<path d="M-42 0 H-18 M18 -18 H42 M18 18 H42 M-18 0 L18 ${closed?'18':'-18'}"/><circle cx="-18" r="3"/><circle cx="18" cy="-18" r="3"/><circle cx="18" cy="18" r="3"/>`;
case'rcd':return box('ΔI');case'fuse':return '<path d="M-42 0 H-20 M20 0 H42"/><rect x="-20" y="-12" width="40" height="24"/>';
case'overload':return box('FR');case'emergency':return contacts(true,'M0 -26 V-8 M-10 -26 H10 M-15 -32 H15');
case'no':case'relayno':return contacts(false,'',closed);case'nc':case'relaync':return contacts(true,'',closed);
case'pushno':case'limitno':return contacts(false,'M0 -26 V-8 M-9 -26 H9',closed);
case'pushnc':case'limitnc':return contacts(true,'M0 -26 V-8 M-9 -26 H9',closed);
case'timerNo':return contacts(false,'M-5 24 H5 M0 18 V27');case'timerNc':return contacts(true,'M-5 24 H5 M0 18 V27');
case'coil':return '<path d="M-42 0 H-20 M20 0 H42"/><rect x="-20" y="-17" width="40" height="34" rx="3"/>';
case'timer':return circleText('T');case'lamp':return '<path d="M-42 0 H-19 M19 0 H42"/><circle r="19"/><path d="M-13 -13 L13 13 M13 -13 L-13 13"/>';
case'led':return '<path d="M-42 0 H-20 M20 0 H42"/><circle r="20"/><path d="M-11 0 L8 -11 V11 Z M8 -12 V12 M14 -18 L23 -27 M16 -9 L26 -18"/>';
case'buzzer':return '<path d="M-42 0 H-18 M18 0 H42 M-18 -15 V15 H6 L18 8 V-8 L6 -15 Z M22 -15 Q37 0 22 15"/>';
case'solenoid':return box('Y');case'motor':return circleText('M');case'motor3':return circleText('M3~');case'motor1':return circleText('M1~');case'motordc':return circleText('M⎓');
case'resistor':return '<path d="M-42 0 H-25 M25 0 H42 M-25 0 L-17 -10 L-9 10 L-1 -10 L7 10 L15 -10 L25 0"/>';
case'heater':return box('EH');case'sensor':return box('S');case'photo':return box('光');case'proximity':return box('近');case'pressure':return box('P');case'temperature':return box('θ');
case'ammeter':return circleText('A');case'voltmeter':return circleText('V');case'capacitor':return '<path d="M-42 0 H-7 M-7 -18 V18 M7 -18 V18 M7 0 H42"/>';
case'diode':return '<path d="M-42 0 H-15 M15 0 H42 M-15 -15 L15 0 L-15 15 Z M15 -17 V17"/>';
case'rectifier':return box('AC/DC');case'inverter':return box('VFD');case'contactorPower':return box('KM');
case'plcIn':return box('I');case'plcOut':return box('Q');case'logicAnd':return box('&');case'logicOr':return box('≥1');
case'valve':return '<path d="M-42 0 H-25 M25 0 H42"/><rect x="-25" y="-17" width="50" height="34"/><path d="M0 -17 V17 M-22 12 L-3 -12 M3 12 L22 -12"/>';
case'cylinder':return '<path d="M-42 0 H-25"/><rect x="-25" y="-15" width="48" height="30"/><path d="M3 -15 V15 M3 0 H42"/>';
case'terminal':return '<path d="M-42 0 H-12 M12 0 H42"/><circle r="12"/><path d="M-8 -8 L8 8"/>';

}return lead}
$('palette').innerHTML=groups.map(([title,items])=>`<div class="group"><span class="groupTitle">${title}</span>${items.map(t=>`<div class="tool" draggable="true" data-type="${t}"><svg viewBox="-47 -36 94 72"><g class="symbol">${symbol(t)}</g></svg><span>${labels[t]}</span></div>`).join('')}</div>`).join('');
let project={version:4,parts:[],wires:[]},chosen=null,selected=null,pending=null,gesture=null,simulating=false,coilMemory={},linkMode=false,linkSelection=new Set();
const undoStack=[];let activeWireColor='',colorMode=false;const colorOk=c=>c===''||/^#[0-9a-fA-F]{6}$/.test(c);function checkpoint(){undoStack.push(JSON.stringify(project));if(undoStack.length>80)undoStack.shift();$('undo').disabled=false}function undo(){if(!undoStack.length)return;project=JSON.parse(undoStack.pop());selected=null;pending=null;gesture=null;preview();render();$('message').textContent='已撤回上一步。'}function chooseColor(c){if(!colorOk(c))return;activeWireColor=c;colorMode=true;render();$('message').textContent='已选择导线颜色。现在可以接线，或点击已有导线上色。'}const loadTypes=new Set(['lamp','led','buzzer','motor','motor3','motor1','motordc','heater','coil','timer','solenoid']);
const switchTypes=new Set(['switch','spdt','disconnector','breaker','breaker3','thermal3','no','nc','pushno','pushnc','emergency','selector','limitno','limitnc','relayno','relaync','timerNo','timerNc','overload']);

const passiveTypes=new Set(['fuse','terminal','connector','junction']);
const sourcePlusTypes=new Set(['phase','ac','threephase']);
function ports(p){if(p.type==='phase3')return['l1','l2','l3'];if(p.type==='motor3line')return['u','v','w','pe'];if(['contact3','breaker3','thermal3'].includes(p.type))return['i1','i2','i3','o1','o2','o3'];if(p.type==='node')return['p'];if(p.type==='panel')return['l','n','pe'];if(p.type==='spdt')return['a','b','c'];return fourPort(p.type)?['a','b','c','d']:['a','b']}

$('desk').addEventListener('pointerup',e=>{if(!gesture)return;if(gesture.kind==='momentary'){const p=project.parts.find(x=>x.id===gesture.id);if(p)p.closed=p.type==='pushnc';gesture=null;render();return}if(gesture.kind==='wire'&&pending){const el=document.elementFromPoint(e.clientX,e.clientY),port=el?.closest?.('[data-side]');if(port&&port.dataset.part!==pending.id)connect({id:port.dataset.part,side:port.dataset.side});else{const wire=el?.closest?.('[data-wire]');if(wire)tapWire(wire.dataset.wire,position(e));else{preview();render()}}}gesture=null});
$('desk').addEventListener('pointercancel',()=>{if(gesture?.kind==='momentary'){const p=project.parts.find(x=>x.id===gesture.id);if(p)p.closed=p.type==='pushnc'}gesture=null;preview();render()});
function remove(){if(!selected)return;checkpoint();if(selected.kind==='part'){project.parts=project.parts.filter(p=>p.id!==selected.id);project.wires=project.wires.filter(w=>w.a!==selected.id&&w.b!==selected.id);if(pending?.id===selected.id)pending=null}else if(selected.kind==='junction'){project.hiddenJunctions=[...new Set([...(project.hiddenJunctions||[]),selected.key])]}else if(selected.kind==='bend'){const w=project.wires.find(x=>x.id===selected.id);if(w&&w.via&&selected.index>=0&&selected.index<w.via.length)w.via.splice(selected.index,1)}else project.wires=project.wires.filter(w=>w.id!==selected.id);const removedBend=selected.kind==='bend',removedJunction=selected.kind==='junction';selected=null;cleanupLinks();preview();render();$('message').textContent=removedBend?'已删除所选转折点，导线已重新连接。':removedJunction?'已隐藏黑点，导线及电气连接保持不变。':'已删除所选对象。'}
function rename(){if(selected?.kind!=='part')return;const p=project.parts.find(x=>x.id===selected.id);if(!p)return;const v=prompt('元件名称',p.name);if(v!==null&&v.trim().slice(0,32)!==p.name){checkpoint();p.name=v.trim().slice(0,32)||p.name;render()}}
function setRotation(value){if(simulating){$('message').textContent='请先结束演示，再旋转元件。';render();return}const p=selected?.kind==='part'?project.parts.find(x=>x.id===selected.id):null;if(!p){$('message').textContent='请先选中画布元件。';render();return}const n=Number(value);if(!Number.isFinite(n))return;const angle=((Math.round(n)%360)+360)%360;if(angle!==((p.rotation||0)%360)){checkpoint();p.rotation=angle}if(pending){pending=null;preview()}render()}
$('desk').addEventListener('dblclick',e=>{const part=e.target.closest('g[data-part]');if(part&&!simulating&&!linkMode){selected={kind:'part',id:part.dataset.part};rename()}});
document.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();remove()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();undo();return}if(e.key==='Escape'){if(linkMode)setLinkMode(false);else{pending=null;gesture=null;chosen=null;preview();render()}}if(e.key.toLowerCase()==='r'&&!e.repeat&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();const p=selected?.kind==='part'?project.parts.find(x=>x.id===selected.id):null;if(p)setRotation((p.rotation||0)+90)}});
$('undo').onclick=undo;$('stopColor').onclick=()=>{colorMode=false;activeWireColor='';render();$('message').textContent='已退出导线上色。'};document.querySelector('.colorBar').addEventListener('click',e=>{const c=e.target.closest('[data-color]');if(c)chooseColor(c.dataset.color)});$('customWireColor').addEventListener('input',e=>chooseColor(e.target.value));$('remove').onclick=remove;$('rename').onclick=rename;$('rotate').onclick=()=>{const p=selected?.kind==='part'?project.parts.find(x=>x.id===selected.id):null;setRotation((p?.rotation||0)+90)};
$('rotationRange').addEventListener('input',e=>setRotation(e.target.value));$('rotationNumber').addEventListener('change',e=>setRotation(e.target.value));
$('simulate').onclick=()=>{if(linkMode)setLinkMode(false);simulating=!simulating;pending=null;gesture=null;coilMemory={};preview();render();$('message').textContent=simulating?'演示中：点击开关切换；变压器按简化二次侧供电逻辑工作。':'已结束演示，可以移动元件和调整接线。'};
$('linkMode').onclick=()=>setLinkMode(!linkMode);$('confirmLink').onclick=confirmLinks;$('cancelLink').onclick=cancelLinks;$('exitLink').onclick=()=>setLinkMode(false);
$('new').onclick=()=>{if(project.parts.length&&!confirm('新建会清空当前未保存的画布，继续吗？'))return;checkpoint();project={version:4,parts:[],wires:[]};simulating=false;linkMode=false;linkSelection.clear();$('linkPanel').hidden=true;selected=null;pending=null;coilMemory={};preview();render()};
$('demo').onclick=()=>{if(project.parts.length&&!confirm('示例会替换当前画布，继续吗？'))return;checkpoint();const specs=[['phase','L1',140,190],['switch','S1',360,190],['lamp','HL1',580,310],['neutral','N',800,310]];project={version:4,parts:specs.map(([type,name,x,y])=>({id:uid(),type,name,x,y})),wires:[]};const link=(a,ap,b,bp,via=[])=>project.wires.push({id:uid(),a:project.parts[a].id,ap,b:project.parts[b].id,bp,via});link(0,'b',1,'a');link(1,'b',2,'a',[{x:480,y:190},{x:480,y:310}]);link(2,'b',3,'a');simulating=false;linkMode=false;linkSelection.clear();$('linkPanel').hidden=true;selected=null;pending=null;coilMemory={};preview();render();$('message').textContent='已载入简单示例：开始演示后点击 S1，小灯会亮。'};
$('save').onclick=()=>{const blob=new Blob([JSON.stringify(project,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='电气电路工程.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
function validProject(d){if(!d||!Array.isArray(d.parts)||!Array.isArray(d.wires)||d.parts.length>1000||d.wires.length>3000)throw Error('工程格式不正确');if(d.hiddenJunctions!==undefined&&(!Array.isArray(d.hiddenJunctions)||d.hiddenJunctions.length>1000||d.hiddenJunctions.some(k=>typeof k!=='string'||k.length>100)))throw Error('接线标记格式不正确');if(d.parts.some(p=>!labels[p.type]||typeof p.id!=='string'||!Number.isFinite(p.x)||!Number.isFinite(p.y)||typeof p.name!=='string'||(p.rotation!==undefined&&!Number.isFinite(p.rotation))||(p.linkGroup!==undefined&&(typeof p.linkGroup!=='string'||p.linkGroup.length>64))))throw Error('元件格式不正确');const pm=new Map(d.parts.map(p=>[p.id,p]));if(d.wires.some(w=>!pm.has(w.a)||!pm.has(w.b)||!ports(pm.get(w.a)).includes(w.ap)||!ports(pm.get(w.b)).includes(w.bp)||!Array.isArray(w.via??[])||(w.via??[]).some(v=>!Number.isFinite(v.x)||!Number.isFinite(v.y))||!colorOk(w.color||'')||(w.dash!==undefined&&typeof w.dash!=='boolean')))throw Error('导线格式不正确')}
$('open').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());validProject(d);checkpoint();project={version:4,diagramStyle:!!d.diagramStyle,annotations:Array.isArray(d.annotations)?d.annotations:[],hiddenJunctions:Array.isArray(d.hiddenJunctions)?d.hiddenJunctions:[],parts:d.parts.map(p=>({...p,name:p.name.slice(0,32)})),wires:d.wires.map(w=>({...w,via:w.via||[]}))};cleanupLinks();simulating=false;linkMode=false;linkSelection.clear();$('linkPanel').hidden=true;selected=null;pending=null;coilMemory={};preview();render();$('message').textContent='工程已打开。'}catch(err){alert('打开失败：'+err.message)}finally{e.target.value=''}};
render();
})();
